<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        /* ========== مكان النص الخاص بك ========== */
        .custom-text {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #111;
            margin-bottom: 30px;
            line-height: 1.5;
            max-width: 800px;
            padding: 0 15px;
        }
        /* ======================================= */

        .video-container {
            width: 90%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background-color: #000000;
            border-radius: 12px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.18);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .spinner {
            width: 58px;
            height: 58px;
            border: 4px solid rgba(255, 255, 255, 0.25);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-text {
            position: absolute;
            bottom: 28px;
            color: rgba(255, 255, 255, 0.65);
            font-size: 14px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <! خطيير😱
    فديو يقين المسرب >
    <div class="custom-text">
        اكتب هنا النص اللي تبيه يظهر فوق الفيديو
    </div>

    <div class="video-container">
        <div class="spinner"></div>
        <div class="status-text">جاري البحث...</div>
    </div>

</body>
</html>
